name: JARVIS SIM7600 Voice Bridge
slug: jarvis_sim7600_voice
version: 0.4.14
stage: experimental
description: SIM7600 voice + Yandex SpeechKit LiveTTS / STT + DeepSeek + HA and Q1
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8098
panel_admin: true
panel_icon: mdi:robot-outline
panel_title: JARVIS Q1
hassio_api: true
homeassistant_api: true
discovery:
  - jarvis_q1
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
uart: true
usb: true
udev: true
audio: true
video: true
options:
  auto_install_integration: true
  at_port: /dev/ttyUSB2
  pcm_port: /dev/ttyUSB4
  serial_baud: 115200
  allowed_number: ""
  api_token: ""
  max_calls_per_hour: 4
  call_playback_volume: 50
  auto_answer: false
  yandex_api_key: ""
  yandex_voice: "denis"
  yandex_role: "neutral"
  deepseek_api_key: ""
  deepseek_model: "deepseek-flash"
  camera_entity: ""
  home_tts_entity: ""
  telegram_photo_target: ""
  q1_video_device: ""
  q1_mic_device: ""
  q1_speaker_device: ""
  media_allowed_hosts:
    - homeassistant
    - supervisor
    - homeassistant.local
  observed_entities: []
  allowed_entities: []
  allow_domains:
    - light
    - switch
    - cover
    - fan
    - scene
    - media_player
  system_prompt: "Ты Джарвис, краткий русскоязычный голосовой ассистент. Задавай уточняющие вопросы. Не утверждай, что действие выполнено, до успешного ответа инструмента."
schema:
  auto_install_integration: bool
  at_port: str
  pcm_port: str
  serial_baud: int
  allowed_number: str
  api_token: password
  max_calls_per_hour: int(1,20)
  call_playback_volume: int(10,100)
  auto_answer: bool
  yandex_api_key: password
  yandex_voice: str
  yandex_role: str
  deepseek_api_key: password
  deepseek_model: str
  camera_entity: str
  home_tts_entity: str
  telegram_photo_target: str
  q1_video_device: str
  q1_mic_device: str
  q1_speaker_device: str
  media_allowed_hosts:
    - str
  observed_entities:
    - str
  allowed_entities:
    - str
  allow_domains:
    - str
  system_prompt: str
ports:
  8099/tcp: null
ports_description:
  8099/tcp: API. Only expose on trusted LAN and configure Bearer token
