name: JARVIS SIM7600 Voice Bridge
slug: jarvis_sim7600_voice
version: 0.7.0
stage: experimental
description: Smart GSM assistant for SIM7600 and Home Assistant
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8098
panel_admin: true
panel_icon: mdi:robot-outline
panel_title: JARVIS Q1
hassio_api: true
homeassistant_api: true
discovery:
  - jarvis_q1
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
uart: true
usb: true
udev: true
audio: true
video: true
options:
  auto_install_integration: true
  at_port: /dev/ttyUSB2
  pcm_port: /dev/ttyUSB4
  serial_baud: 115200
  allowed_number: ""
  owner_name: ""
  owner_locks: []
  api_token: ""
  max_calls_per_hour: 4
  llm_daily_token_limit: 0
  call_playback_volume: 50
  call_echo_filter: false
  auto_answer: false
  yandex_api_key: ""
  yandex_voice: "denis"
  yandex_role: "casual"
  deepseek_api_key: ""
  deepseek_model: "deepseek-flash"
  deepseek_effort: "off"
  llm_active: "deepseek"
  llm_fallback_ids: []
  speech_fallback_enabled: false
  speech_fallback_base_url: ""
  speech_fallback_api_key: ""
  speech_fallback_stt_model: ""
  speech_fallback_tts_model: ""
  speech_fallback_voice: ""
  llm_profiles: []
  camera_entity: ""
  home_tts_entity: ""
  telegram_photo_target: ""
  q1_video_device: ""
  q1_mic_device: ""
  q1_speaker_device: ""
  media_allowed_hosts:
    - homeassistant
    - homeassistant.local
  family_members: []
  gate_pin: ""
  reminder_calendar: ""
  reminder_person: ""
  speech_cache_enabled: true
  confirm_risky_actions: false
  ha_events: true
  call_summary: false
  stream_replies: true
  observe_all_entities: false
  control_all_entities: false
  observed_entities: []
  allowed_entities: []
  room_entities: []
  room_agent: jarvis
  assist_agent_id: ""
  country_code: "7"
  allow_domains:
    - light
    - switch
    - cover
    - fan
    - scene
    - media_player
  system_prompt: ""
schema:
  auto_install_integration: bool
  at_port: str
  pcm_port: str
  serial_baud: int
  allowed_number: str
  owner_name: str
  owner_locks:
    - str
  api_token: password
  max_calls_per_hour: int(1,20)
  llm_daily_token_limit: int(0,10000000)
  call_playback_volume: int(10,100)
  call_echo_filter: bool
  auto_answer: bool
  yandex_api_key: password
  yandex_voice: str
  yandex_role: str
  deepseek_api_key: password
  deepseek_model: str
  deepseek_effort: str
  llm_active: str
  llm_fallback_ids:
    - str
  speech_fallback_enabled: bool
  speech_fallback_base_url: str
  speech_fallback_api_key: password
  speech_fallback_stt_model: str
  speech_fallback_tts_model: str
  speech_fallback_voice: str
  llm_profiles:
    - id: str
      name: str
      base_url: str
      model: str
      effort: str
      api_key: password
  camera_entity: str
  home_tts_entity: str
  telegram_photo_target: str
  q1_video_device: str
  q1_mic_device: str
  q1_speaker_device: str
  media_allowed_hosts:
    - str
  family_members:
    - str
  gate_pin: password
  reminder_calendar: str
  reminder_person: str
  speech_cache_enabled: bool
  confirm_risky_actions: bool
  ha_events: bool
  call_summary: bool
  stream_replies: bool
  observe_all_entities: bool
  control_all_entities: bool
  observed_entities:
    - str
  allowed_entities:
    - str
  room_entities:
    - str
  room_agent: list(jarvis|assist)
  assist_agent_id: str
  country_code: match(^[0-9]{0,3}$)
  allow_domains:
    - str
  system_prompt: str
ports:
  8099/tcp: null
ports_description:
  8099/tcp: API. Only expose on trusted LAN and configure Bearer token
