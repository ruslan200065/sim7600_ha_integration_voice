name: JARVIS SIM7600 Voice Bridge
slug: jarvis_sim7600_voice
version: 0.2.0
stage: experimental
description: SIM7600 voice + Yandex SpeechKit LiveTTS / STT + DeepSeek + HA and Q1
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
hassio_api: true
homeassistant_api: true
auth_api: true
uart: true
usb: true
udev: true
audio: true
video: true
options:
  at_port: /dev/ttyUSB2
  pcm_port: /dev/ttyUSB4
  serial_baud: 115200
  allowed_number: ""
  api_token: ""
  max_calls_per_hour: 4
  auto_answer: false
  yandex_api_key: ""
  yandex_voice: "denis"
  yandex_role: "neutral"
  deepseek_api_key: ""
  deepseek_model: "deepseek-flash"
  camera_entity: ""
  q1_video_device: ""
  q1_mic_device: ""
  q1_speaker_device: ""
  allowed_entities: []
  allow_domains:
    - light
    - switch
    - cover
  system_prompt: "Ты Джарвис, краткий русскоязычный голосовой ассистент. Задавай уточняющие вопросы. Не утверждай, что действие выполнено, до успешного ответа инструмента."
schema:
  at_port: str
  pcm_port: str
  serial_baud: int
  allowed_number: str
  api_token: password
  max_calls_per_hour: int(1,20)
  auto_answer: bool
  yandex_api_key: password
  yandex_voice: str
  yandex_role: str
  deepseek_api_key: password
  deepseek_model: str
  camera_entity: str
  q1_video_device: str
  q1_mic_device: str
  q1_speaker_device: str
  allowed_entities:
    - str
  allow_domains:
    - str
  system_prompt: str
ports:
  8099/tcp: null
ports_description:
  8099/tcp: API. Only expose on trusted LAN and configure Bearer token
