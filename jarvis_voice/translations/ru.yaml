configuration:
  at_port:
    name: AT-порт модема
    description: Порт управления SIM7600. Если доступен путь /dev/serial/by-id, выберите его в веб-панели.
  pcm_port:
    name: Порт звука телефонного звонка
    description: Экспериментальный PCM-порт SIM7600. Оставьте пустым, если голосовой канал модема не используется.
  serial_baud:
    name: Скорость AT-порта
    description: Используйте скорость, на которой модем отвечает. Обычно 115200.
  allowed_number:
    name: Разрешённый телефонный номер
    description: Единственный номер для звонков и автоответа, в международном формате.
  auto_answer:
    name: Автоответ
    description: Автоматически ответить при совпадении номера звонящего с разрешённым.
  max_calls_per_hour:
    name: Лимит исходящих звонков
    description: Максимальное количество исходящих звонков за час.
  llm_daily_token_limit:
    name: Дневной лимит токенов LLM
    description: Сколько токенов (запрос + ответ) можно потратить за сутки по каждому профилю. 0 — без ограничения.
  yandex_api_key:
    name: Ключ Yandex SpeechKit
    description: Нужен для распознавания и синтеза речи. Для проверки устройств ключ не требуется.
  yandex_voice:
    name: Голос SpeechKit
    description: Имя голоса для потокового синтеза. По умолчанию denis.
  yandex_role:
    name: Амплуа SpeechKit
    description: Манера речи выбранного голоса. По умолчанию neutral.
  deepseek_api_key:
    name: Ключ DeepSeek
    description: Нужен для ответов ассистента и управления разрешёнными сущностями.
  deepseek_model:
    name: Модель DeepSeek
    description: Идентификатор модели, доступной для указанного ключа.
  q1_video_device:
    name: USB-камера Q1
    description: Веб-панель подскажет доступные видеоустройства.
  q1_mic_device:
    name: Устройство захвата звука
    description: На Home Assistant OS обычно pulse. Вход Sonix можно выбрать в веб-панели.
  q1_speaker_device:
    name: Устройство воспроизведения
    description: На Home Assistant OS обычно pulse. Выход Microchip можно выбрать в веб-панели.
  camera_entity:
    name: Камера Home Assistant для ассистента
    description: Необязательный идентификатор camera.*. Если пусто, ассистент использует USB-камеру Q1.
  confirm_risky_actions:
    name: Подтверждать рискованные действия
    description: Перед управлением приводами, кранами, сиренами, сценами, пылесосами и газонокосилками, а также перед созданием правил «сделай, когда» ассистент переспрашивает и ждёт «да» в следующей реплике.
  ha_events:
    name: События в Home Assistant
    description: Отправлять события jarvis_call_incoming, jarvis_call_ended, jarvis_dtmf и jarvis_sms_received для автоматизаций.
  call_summary:
    name: Итог звонка
    description: После каждого разговора модель пишет короткое резюме и отправляет его в уведомление Home Assistant и событие jarvis_call_summary. Расходует токены LLM.
  stream_replies:
    name: Потоковые ответы
    description: Во время звонка готовые предложения ответа озвучиваются сразу, пока модель дописывает остальное. Это сокращает паузу перед ответом. Если сервер модели не поддерживает потоковый режим, ответ приходит целиком, как раньше.
  observe_all_entities:
    name: Читать все устройства
    description: Разрешает владельцу читать состояния всех сущностей и получать кадры со всех камер. Участникам семьи камеры, люди и трекеры доступны только из явного списка.
  control_all_entities:
    name: Управлять всеми поддерживаемыми устройствами
    description: Включает поддерживаемые действия для света, выключателей, приводов, вентиляторов и медиаплееров. Сцены, а также ворота, гаражи и двери через этот флаг недоступны, их нужно разрешить явно.
  allowed_entities:
    name: Разрешённые сущности
    description: Сущности, которые ассистент может читать или которыми может управлять.
  room_entities:
    name: Устройства для голоса из комнаты
    description: Сущности, доступные через микрофон Q1 и /chat. Говорящего в комнате нельзя опознать, поэтому у этого профиля нет доступа к камерам, замкам, заметкам и истории владельца.
  room_agent:
    name: Агент для голоса из комнаты
    description: jarvis — отвечает JARVIS с правами профиля «Комната»; assist — фраза уходит в Home Assistant Assist (conversation/process) с правами Assist.
  assist_agent_id:
    name: ID агента Assist
    description: Например conversation.home_assistant или агент LLM. Пусто — агент по умолчанию.
  country_code:
    name: Код страны
    description: Код без плюса (например 7). Нужен, чтобы номера 8XXX и +7XXX считались одним номером.
  allow_domains:
    name: Разрешённые типы команд
    description: Дополнительное ограничение на управление светом, выключателями и приводами.
  system_prompt:
    name: Инструкция ассистента
    description: Правила диалога, отправляемые в DeepSeek.
  api_token:
    name: Токен локального REST API
    description: Оставьте пустым для автоматической генерации. Веб-панель использует вход в Home Assistant.
  media_allowed_hosts:
    name: Разрешённые источники аудио
    description: Имена хостов, с которых динамик может загружать звук по HTTP или HTTPS.
  auto_install_integration:
    name: Установить интеграцию JARVIS Q1
    description: Аддон обновляет интеграцию в папке Home Assistant. После обновления её кода перезапустите Core.
network:
  8099/tcp: Локальный REST API. Для веб-панели порт открывать не нужно.
