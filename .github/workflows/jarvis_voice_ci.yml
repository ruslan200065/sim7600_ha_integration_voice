name: Jarvis Voice CI
on:
  push:
    paths:
      - "jarvis_voice/**"
      - ".github/workflows/jarvis_voice_ci.yml"
  pull_request:
    paths:
      - "jarvis_voice/**"
      - ".github/workflows/jarvis_voice_ci.yml"
jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q jarvis_voice
      - run: python -m pip install pyserial pytest aiohttp
      - run: pytest -q jarvis_voice/tests
