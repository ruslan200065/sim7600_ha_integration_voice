name: Jarvis Voice CI
on:
  push:
    paths:
      - "jarvis_voice/**"
      - ".github/workflows/jarvis_voice_ci.yml"
  pull_request:
    paths:
      - "jarvis_voice/**"
      - ".github/workflows/jarvis_voice_ci.yml"
jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: jarvis_voice/requirements.txt
      - name: Compile all sources
        run: python -m compileall -q jarvis_voice
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r jarvis_voice/requirements.txt pytest pytest-asyncio ruff
      - name: Ruff (syntax, undefined names, unused imports)
        run: ruff check jarvis_voice --target-version py312 --select E9,F63,F7,F82,F841,F401
      - name: Run tests
        run: pytest -q jarvis_voice/tests
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Home Assistant add-on
        run: |
          base=$(awk '$1 == "amd64:" { print $2 }' jarvis_voice/build.yaml)
          docker build --build-arg BUILD_FROM="$base" -t jarvis-voice-test jarvis_voice
      - name: Check runtime image contents
        run: |
          docker run --rm --entrypoint /opt/venv/bin/python jarvis-voice-test -c \
            "import importlib.util, sys; sys.exit(importlib.util.find_spec('grpc_tools') is not None)"
          docker run --rm --entrypoint /bin/sh jarvis-voice-test -c \
            'for b in ffmpeg aplay arecord pactl v4l2-ctl; do command -v "$b" >/dev/null || { echo "missing $b"; exit 1; }; done'
      - name: Start through s6 and check health
        run: |
          printf '%s\n' '{"auto_install_integration":false,"at_port":"/dev/missing","api_token":"smoke-test","yandex_api_key":"smoke-test"}' > "$RUNNER_TEMP/jarvis-options.json"
          docker run -d --name jarvis-voice-test -p 127.0.0.1:8099:8099 \
            -e OPTIONS_PATH=/tmp/jarvis-options.json \
            -v "$RUNNER_TEMP/jarvis-options.json:/tmp/jarvis-options.json:ro" jarvis-voice-test
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8099/health
          curl --fail -H 'Authorization: Bearer smoke-test' http://127.0.0.1:8099/status
      - name: Show container log on failure
        if: failure()
        run: docker logs jarvis-voice-test || true
