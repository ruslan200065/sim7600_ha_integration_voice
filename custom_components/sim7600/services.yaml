send_sms:
  fields:
    number:
      required: true
      example: "+79991234567"
      selector:
        text:
    message:
      required: true
      example: "Привет! Hello!"
      selector:
        text:
          multiline: true
    entry_id:
      required: false
      selector:
        config_entry:
          integration: sim7600
    device_id:
      required: false
      selector:
        device:
          integration: sim7600

send_ussd:
  fields:
    code:
      required: true
      example: "*100#"
      selector:
        text:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: sim7600
    device_id:
      required: false
      selector:
        device:
          integration: sim7600
